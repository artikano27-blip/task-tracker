<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column vh-100 overflow-hidden">

<!-- 1. Навигационная панель (видна только авторизованным) -->
<nav id="app-navbar" class="navbar navbar-expand navbar-light bg-white border-bottom shadow-sm d-none mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold mb-0">Менеджер задач 📝</span>

        <div class="d-flex align-items-center gap-3 ms-auto">
                <span class="text-secondary">
                    Пользователь: <strong id="current-username" class="text-dark"></strong>
                </span>
            <button id="logout-btn" class="btn btn-outline-danger btn-sm">
                Выйти
            </button>
        </div>
    </div>
</nav>

<!-- 2. Экран авторизации (по центру экрана на всю высоту окна) -->
<div id="auth-view" class="container app-view">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <!-- Переключатель вкладок -->
                    <ul class="nav nav-pills nav-justified mb-3" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="pill"
                                    data-bs-target="#login-pane" type="button" role="tab">Вход
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="pill"
                                    data-bs-target="#register-pane" type="button" role="tab">Регистрация
                            </button>
                        </li>
                    </ul>

                    <!-- Содержимое вкладок -->
                    <div class="tab-content" id="authTabContent">
                        <!-- Форма входа -->
                        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                            <form id="login-form">
                                <div class="mb-3">
                                    <label for="login-username" class="form-label">Имя пользователя</label>
                                    <input type="text" class="form-control" id="login-username" required
                                           autocomplete="username">
                                </div>
                                <div class="mb-3">
                                    <label for="login-password" class="form-label">Пароль</label>
                                    <input type="password" class="form-control" id="login-password" required
                                           autocomplete="current-password">
                                    <div class="invalid-feedback">
                                        Неверное имя пользователя или пароль
                                    </div>
                                </div>
                                <button type="submit" id="loginBtn" class="btn btn-primary w-100">Войти</button>
                            </form>
                        </div>

                        <!-- Форма регистрации -->
                        <div class="tab-pane fade" id="register-pane" role="tabpanel">
                            <form id="register-form">
                                <div class="mb-3">
                                    <label for="reg-username" class="form-label">Имя пользователя</label>
                                    <input type="text" class="form-control" id="reg-username" required
                                           autocomplete="username">
                                    <div class="invalid-feedback">
                                        Пользователь уже существует
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="reg-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="reg-email" required
                                           autocomplete="email">
                                    <div class="invalid-feedback">
                                        Почта уже существует
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="reg-password" class="form-label">Пароль</label>
                                    <input type="password" class="form-control" id="reg-password" required
                                           autocomplete="new-password">
                                </div>
                                <div class="mb-3">
                                    <label for="reg-confirm-password" class="form-label">Проверка пароля</label>
                                    <input type="password" class="form-control" id="reg-confirm-password" required
                                           autocomplete="new-password">
                                    <div class="invalid-feedback">Пароли не совпадают</div>
                                </div>
                                <button type="submit" id="regBtn" class="btn btn-success w-100">Зарегистрироваться</button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- 3. Экран задач (канбан-доска) -->
<main id="tasks-view" class="container-fluid px-4 flex-grow-1 overflow-x-auto overflow-y-hidden d-none app-view">
    <div id="board-columns" class="d-flex flex-row align-items-start gap-3 py-3" style="min-height: 100%;">

        <!-- Пример каркаса одной колонки -->
        <div class="card bg-body-secondary shadow-sm" style="width: 280px; min-width: 280px;">
            <div class="card-body p-2 d-flex flex-column">
                <h6 class="card-title fw-bold px-2 py-1 mb-2">К выполнению 📌</h6>

                <!-- Контейнер карточек этой колонки -->
                <div class="task-list d-flex flex-column gap-2 mb-2">
                    <!-- Сюда добавляются карточки задач -->
                </div>

                <button class="btn btn-sm btn-outline-secondary w-100 text-start">
                    + Добавить карточку
                </button>
            </div>
        </div>

        <!-- Кнопка добавления новой колонки -->
        <div>
            <button id="add-column-btn" class="btn btn-outline-secondary" style="width: 280px; min-width: 280px;">
                + Добавить еще одну колонку
            </button>
        </div>
    </div>

</main>

<div class="modal fade" id="cardModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <textarea class="form-control fw-bold fs-5 border-0 shadow-none px-1" id="modalCardTitle" rows="1"
                          placeholder="Название карточки"></textarea>
                <div class="invalid-feedback">Название задачи не может быть пустым</div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label text-secondary small fw-semibold">Описание</label>
                <textarea class="form-control" id="modalCardDescription" rows="4"
                          placeholder="Добавьте более подробное описание..."></textarea>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary btn-sm" id="btnSaveCard">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
    <div id="errorToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive"
         aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="errorToastText">
                <!-- Текст ошибки подставим через JavaScript -->
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Закрыть"></button>
        </div>
    </div>
</div>

<!-- Скрипты -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
